name: auroprint
description: Spoof-proof device fingerprint generation with hardware-backed signing and attestation
version: 0.1.0
homepage: https://github.com/arrorLabArts/auroprint-flutter

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.arrorlabarts.auroprint
        pluginClass: AuroprintPlugin
      ios:
        pluginClass: AuroprintPlugin
